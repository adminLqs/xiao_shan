# ============================================
# 服务器配置
# ============================================
server:
  # 服务端口号
  port: 8088

  # Undertow 容器配置（高性能Web服务器，替代Tomcat）
  undertow:
    # IO线程数：处理网络IO的线程数，默认为CPU核心数×2
    # 8核CPU推荐8，4核CPU推荐4
    io-threads: 8

    # 工作线程数：处理业务逻辑的线程数，默认为IO线程数×8
    # 64表示最多同时处理64个请求
    worker-threads: 64

    # 缓冲区大小：每个连接使用的缓冲区大小，单位字节
    # 16KB适合大多数场景，过小影响性能，过大浪费内存
    buffer-size: 16384

    # 是否使用直接内存（NIO的DirectByteBuffer）
    # true：性能更好，但内存管理需要依赖JVM
    direct-buffers: true

    # 每个请求的最大参数数量（包含GET和POST参数）
    # 防止恶意请求携带大量参数攻击
    max-parameters: 1000

    # 每个请求的最大HTTP头数量
    # 防止恶意请求携带大量头信息
    max-headers: 200

    # 请求体最大大小，单位字节
    # 104857600 = 100MB，与文件上传配置保持一致
    max-entity-size: 104857600

  # HTTP响应压缩配置（减少网络传输量）
  compression:
    # 启用压缩
    enabled: true
    # 需要压缩的MIME类型
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    # 最小响应大小（字节），小于此值不压缩
    min-response-size: 2048

# ============================================
# Spring Boot 核心配置
# ============================================
spring:
  # 应用名称（用于服务注册、监控等）
  application:
    name: shopping

  # ========== 数据源配置 ==========
  datasource:
    # 数据库连接URL
    # serverTimezone=Asia/Shanghai：时区设置
    # characterEncoding=utf8：字符编码
    # useSSL=false：禁用SSL（本地开发）
    # allowPublicKeyRetrieval=true：允许获取公钥（MySQL 8.0+）
    url: jdbc:mysql://localhost:3306/shopping-mobile?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码
    password: 21125211323
    # MySQL驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP 连接池配置（Spring Boot默认，性能最好的连接池）
    hikari:
      # 最小空闲连接数：连接池保持的最小空闲连接
      minimum-idle: 5
      # 最大连接数：连接池最多能创建的连接数
      # 20个连接在QPS=200的系统中足够用
      maximum-pool-size: 20
      # 空闲超时：连接空闲多久后被释放（毫秒）
      # 300000ms = 5分钟
      idle-timeout: 300000
      # 连接超时：获取连接的最大等待时间（毫秒）
      # 20000ms = 20秒，超时则抛出异常
      connection-timeout: 20000
      # 连接最大存活时间：连接最多存活多久（毫秒）
      # 必须小于MySQL的wait_timeout（默认8小时）
      max-lifetime: 600000
      # 连接泄漏检测阈值（毫秒）
      # 60000ms = 1分钟，超过此时间未归还则记录警告
      leak-detection-threshold: 60000

  # ========== Redis 配置 ==========
  redis:
    # Redis服务器地址
    host: localhost
    # Redis端口
    port: 6379
    # Redis密码（没有则留空）
    password:
    # 使用的数据库索引（0-15）
    database: 0
    # 连接超时时间
    timeout: 5000ms

    # Lettuce客户端配置（Spring Boot默认）
    lettuce:
      # 连接池配置
      pool:
        # 最大活跃连接数
        max-active: 20
        # 最大空闲连接数
        max-idle: 10
        # 最小空闲连接数
        min-idle: 5
      # 关闭超时
      shutdown-timeout: 100ms

  # ========== RabbitMQ 消息队列配置 ==========
  # 生产环境
#  rabbitmq:
#    # RabbitMQ服务器地址
#    host: localhost
#    # RabbitMQ端口
#    port: 5672
#    # 用户名
#    username: admin
#    # 密码
#    password: admin123
#    # 虚拟主机（默认/）
#    virtual-host: /
