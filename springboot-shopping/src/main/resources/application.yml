# ============================================
# Spring Boot Actuator 监控配置
# ============================================
management:
  # 端点配置
  endpoints:
    web:
      # 暴露的端点（health健康检查、info信息、metrics指标）
      exposure:
        include: health,info,metrics
      # 端点访问基础路径
      base-path: /actuator

  # 端点详细配置
  endpoint:
    health:
      # 显示详细健康信息
      show-details: always

  # 指标配置
  metrics:
    export:
      # 导出到Prometheus（配合Grafana监控）
      prometheus:
        enabled: true

# ============================================
# 自定义业务配置（便于统一管理业务参数）
# ============================================
business:
  # 订单配置
  order:
    # 订单超时时间（分钟），30分钟后未支付自动取消
    timeout-minutes: 30
    # 自动确认收货天数，7天后自动确认
    auto-confirm-days: 7

  # 优惠券配置
  coupon:
    # 每人每天领取优惠券上限
    user-daily-limit: 10

  # 安全配置
  security:
    # 登录失败锁定时间（分钟），15分钟内锁定
    login-lock-minutes: 15
    # 最大登录失败次数，5次后锁定
    max-login-attempts: 5