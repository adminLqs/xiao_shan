#      simple:
#        # 确认模式：manual表示手动确认（生产环境推荐）
#        acknowledge-mode: manual
#        # 预取数量：每次只取1条消息（防止消息堆积）
#        prefetch: 1
#        # 最小消费者数
#        concurrency: 5
#        # 最大消费者数
#        max-concurrency: 20
#        # 重试配置
#        retry:
#          # 开启重试
#          enabled: true
#          # 最大重试次数（3次）
#          max-attempts: 3
#          # 初始重试间隔（1秒）
#          initial-interval: 1000ms
#          # 重试间隔倍数（每次×2）
#          multiplier: 2
#          # 最大重试间隔（10秒）
#          max-interval: 10000ms

    # 开发环境
    rabbitmq:
      # RabbitMQ服务器地址
      host: localhost
      # RabbitMQ端口
      port: 5672
      # 用户名
      username: guest
      # 密码
      password: guest
      # 虚拟主机（默认/）
      virtual-host: /
      # WebSocket STOMP协议端口
      stomp:
        port: 61613

      # 消息可靠性配置
      # 开启发布确认（异步），correlated表示发送方确认
      publisher-confirm-type: correlated
      # 开启消息返回（不可路由时返回）
      publisher-returns: true
      template:
        # 强制消息返回（必须配合publisher-returns使用）
        mandatory: true

      # 消息监听器配置
      listener:
        simple:
          # 确认模式：manual表示手动确认（生产环境推荐）
          acknowledge-mode: manual
          # 预取数量：每次只取1条消息（防止消息堆积）
          prefetch: 1
          # 最小消费者数
          concurrency: 5
          # 最大消费者数
          max-concurrency: 20
          # 重试配置
          retry:
            # 开启重试
            enabled: true
            # 最大重试次数（3次）
            max-attempts: 3
            # 初始重试间隔（1秒）
            initial-interval: 1000ms
            # 重试间隔倍数（每次×2）
            multiplier: 2
            # 最大重试间隔（10秒）
            max-interval: 10000ms

  # ========== Jackson JSON 序列化配置 ==========
  jackson:
    # 日期格式（统一使用yyyy-MM-dd HH:mm:ss）
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区（北京时间）
    time-zone: Asia/Shanghai
    # 序列化配置
    serialization:
      # 日期不输出为时间戳（输出为格式化字符串）
      write-dates-as-timestamps: false
    # 默认属性包含策略：只包含非null字段（减少传输量）
    default-property-inclusion: non_null

  # ========== Flyway 数据库版本管理 ==========
  flyway:
    # 启用Flyway（数据库迁移）
    enabled: true
    # 迁移脚本位置（classpath:db/migration）
    locations: classpath:db/migration
    # 允许对已有数据的数据库进行基线化
    baseline-on-migrate: true
    # 基线版本号
    baseline-version: 1
    # 基线描述
    baseline-description: "Base migration"
    # 修复迁移（自动修复Checksum不匹配）
    repair-on-migrate: true

  # ========== 文件上传配置 ==========
  servlet:
    multipart:
      # 单个文件最大大小（100MB）
      max-file-size: 100MB
      # 整个请求最大大小（100MB）
      max-request-size: 100MB
      # 文件大小阈值：超过2MB则写入磁盘（否则在内存中）
      file-size-threshold: 2MB
      # 临时文件存储目录（Linux默认/tmp）
      location: /tmp

  # ========== 异步任务线程池配置 ==========
  task:
    # 异步执行任务配置
    execution:
      pool:
        # 核心线程数（常驻线程）
        core-size: 10
        # 最大线程数（峰值时最多创建50个线程）
        max-size: 50
        # 任务队列容量（200个任务排队等待）
        queue-capacity: 200
      # 线程名前缀（便于日志追踪）
      thread-name-prefix: async-task-
    # 定时任务线程池配置
    scheduling:
      pool:
        # 线程池大小
        size: 5
      # 线程名前缀
      thread-name-prefix: scheduled-task-

# ============================================
# MyBatis ORM框架配置
# ============================================
mybatis:
  # Mapper XML文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名包路径（简化XML中的类型引用）
  type-aliases-package: com.xiaoshan.springbootdemo.entity

  # MyBatis全局配置
  configuration:
    # 开启驼峰命名自动映射：user_name → userName
    map-underscore-to-camel-case: true
    # 日志实现：使用Slf4j
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 启用二级缓存（谨慎使用，默认关闭）
    cache-enabled: false
    # 启用延迟加载
    lazy-loading-enabled: true
    # 积极加载（立即加载关联数据）
    aggressive-lazy-loading: false
    # 本地缓存作用域（statement：仅当前语句）
    local-cache-scope: statement

# ============================================
# JWT 认证配置
# ============================================
jwt:
  # JWT密钥（至少256位，用于HS256算法）
  # 生产环境请使用更复杂的密钥，不要提交到Git
  secret: mySuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm1234567890!

# ============================================
# 文件上传路径配置
# ============================================
app:
  file:
    # 文件上传根目录（相对路径）
    upload-dir: uploads
    # 生产环境建议使用绝对路径：
    # upload-dir: /data/shopping/uploads

# ============================================
# 日志配置
# ============================================
logging:
  # 控制台字符编码
  charset:
    console: UTF-8

  # 日志级别配置
  level:
    # 项目包：INFO级别（生产环境）
    com.xiaoshan.springbootdemo: INFO
    # 降低第三方库日志级别（减少日志量）
    org.springframework: WARN
    org.springframework.security: WARN
    org.springframework.amqp: WARN
    org.apache.ibatis: WARN
    org.hibernate: WARN
    redis.clients: WARN
    com.zaxxer.hikari: WARN

  # 日志文件配置
  file:
    # 日志文件名（相对路径）
    name: logs/shopping.log
    # 单个日志文件最大大小
    max-size: 100MB
    # 保留历史日志天数
    max-history: 7

  # 日志输出格式
  pattern:
    # 控制台日志格式
    # %d：日期 %-5level：日志级别 %thread：线程名 %logger：类名 %msg：消息
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"
    # 文件日志格式
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"

